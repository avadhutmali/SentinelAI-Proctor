<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --bg-color: #1e1e2e;
      --card-bg: #2b2b3b;
      --text-main: #ffffff;
      --text-muted: #a6a6a6;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #22c55e;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 95vh;
    }

    h2 { margin: 0 0 15px 0; font-size: 18px; text-align: center; letter-spacing: 0.5px; }

    /* Video Container */
    .video-wrapper {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #444;
      background: #000;
      aspect-ratio: 4/3;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror effect */
    }

    .rec-dot {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 10px;
      height: 10px;
      background-color: red;
      border-radius: 50%;
      animation: blink 1s infinite;
      display: none; /* Hidden until active */
    }

    @keyframes blink { 50% { opacity: 0; } }

    /* Status Badge */
    .status-badge {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
      background-color: var(--card-bg);
      border: 1px solid #444;
      transition: all 0.3s ease;
    }
    .status-safe { background-color: rgba(34, 197, 94, 0.2); color: var(--success); border-color: var(--success); }
    .status-danger { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); border-color: var(--danger); }

    /* Controls */
    button {
      margin-top: 15px;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background-color: var(--accent);
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    button:hover { background-color: #2563eb; }
    button:disabled { background-color: #4b5563; cursor: not-allowed; }

    /* Terminal Logs */
    .log-header { margin-top: 20px; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    #logs-container {
      margin-top: 5px;
      flex-grow: 1;
      background: #000;
      border-radius: 8px;
      padding: 10px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 11px;
      overflow-y: auto;
      border: 1px solid #333;
    }
    .log-item { margin-bottom: 4px; border-bottom: 1px solid #222; padding-bottom: 2px; }
    .log-time { color: #666; margin-right: 5px; }
    .log-alert { color: var(--danger); font-weight: bold; }
    .log-info { color: var(--accent); }

  </style>
</head>
<body>

  <h2>SentinelAI Proctor</h2>

  <div class="video-wrapper">
    <div class="rec-dot" id="recDot"></div>
    <video id="video" autoplay muted playsinline></video>
  </div>

  <div id="status" class="status-badge">System Idle</div>

  <button id="startBtn">Start Exam Session</button>

  <div class="log-header">Activity Log</div>
  <div id="logs-container">
    <div class="log-item"><span class="log-time">--:--</span>Ready to initialize...</div>
  </div>

  <script src="libs/face-api.js"></script>
  <script src="libs/firebase-app-compat.min.js"></script>
  <script src="libs/firebase-firestore-compat.min.js"></script>
  <script src="sidepanel.js" type="module"></script>

</body>
</html>
